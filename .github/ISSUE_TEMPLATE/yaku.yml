name: 大意の誤り
description: 大意の誤りや、よりよい大意を知らせる
title: "[訳] 山村暮鳥 詩篇（『日本現代文學全集54 千家元麿・山村暮鳥・佐藤惣之助・福士幸次郎・堀口大學集』より） "
labels: ["訳"]
body:
  - type: input
    id: block
    attributes:
      label: 段落ID
      description: "行頭にある ID（例: yamamura-bocho-e9d78a0c-000001）"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: いまの大意
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 直した大意
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・根拠
